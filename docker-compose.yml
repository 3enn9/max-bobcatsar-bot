version: "3.9"

services:
  go-service:
    build:
      context: ./go-service
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      - python-service
      - postgres

  python-service:
    build:
      context: ./python-service
    container_name: python-service
    ports:
      - "50051:50051"

  postgres:
    image: postgres:16-alpine
    container_name: bot_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - go-service

volumes:
  caddy_data:
  caddy_config:
  postgres_data: